name: import-r185-screenshots
on:
  push:
    branches:
      - feature/swr-526-three-r185
    paths:
      - .github/workflows/import-r185-screenshots.yml
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/swr-526-three-r185
      - name: Download and commit screenshots
        run: |
          set -euo pipefail
          mkdir -p docs/verification/three-r185
          cd docs/verification/three-r185
          curl -fsSL -o 01-assembled-male-desktop.png "https://tmpfiles.org/dl/1789046615.34d630742f3b960b/wPwWmIoSqnJr/01-assembled-male-desktop.png"
          curl -fsSL -o 02-selection.png "https://tmpfiles.org/dl/1789046616.39768346866f6d0b/w5wGmTo9qM51/02-selection.png"
          curl -fsSL -o 03-systems-skeleton.png "https://tmpfiles.org/dl/1789046617.cc0a3081edf100e5/wGw2mpodqtWo/03-systems-skeleton.png"
          curl -fsSL -o 04-systems-organs.png "https://tmpfiles.org/dl/1789046618.f5ef368c7efea60f/wlwem2odqO0Y/04-systems-organs.png"
          curl -fsSL -o 05-exploded-view.png "https://tmpfiles.org/dl/1789046618.f22364548ecd38d2/wowAmeobqp7w/05-exploded-view.png"
          curl -fsSL -o 06-search-heart.png "https://tmpfiles.org/dl/1789046619.31057b31a461ea37/w4wNmQoJqDyP/06-search-heart.png"
          curl -fsSL -o 07-isolation.png "https://tmpfiles.org/dl/1789046620.f0e030eaea8d603f/w9wDm4o1qlXm/07-isolation.png"
          curl -fsSL -o 08-mobile-390x844.png "https://tmpfiles.org/dl/1789046621.b6dafb6d7506010d/wzwimHoGqsaU/08-mobile-390x844.png"
          curl -fsSL -o 08b-mobile-systems.png "https://tmpfiles.org/dl/1789046621.34ca1e322088f35c/wnwAmaoEqWvd/08b-mobile-systems.png"
          curl -fsSL -o 09-mobile-320x568.png "https://tmpfiles.org/dl/1789046622.63a652774bf43f21/wiwAmLoKqLY0/09-mobile-320x568.png"
          curl -fsSL -o 10-mobile-844x390.png "https://tmpfiles.org/dl/1789046623.fc0fe52e8c0185a6/w7wsmXoIqI1M/10-mobile-844x390.png"
          python3 - <<'PY'
          import hashlib, pathlib, sys
          expected = {
            '01-assembled-male-desktop.png': ('86a19531e00e5a871bef32adf116314e84bccb31f89a89bad451923c4cada0f6', 32366),
            '02-selection.png': ('79ca0ef9522d4c147abf68eeafe99d8b4328d7e436a018ab28acf01728a48647', 37788),
            '03-systems-skeleton.png': ('dedbf84330c05a0f20d4d5e663e538f39343a02d9c93e89427f106ec74c5c4ad', 26104),
            '04-systems-organs.png': ('c1ce43a43fd138cbe9c3169be3169218486037650e4e93548e4daf93a267f26e', 26790),
            '05-exploded-view.png': ('04b82c4b10882e89c54f86101bbac85de29ccc815188d9e974c9274e94d676ae', 44072),
            '06-search-heart.png': ('ad6dd5aaa1d5c1208dca5a53ece64187a5d11c16a56df64dafe73850f8f34770', 39294),
            '07-isolation.png': ('c0e3edd9acf08b3f708a1a44e8115f6b6b6d500b429e508741302a0b5fa4144b', 35124),
            '08-mobile-390x844.png': ('0a45478166eb008511e1eb2400dc368487fb2299f73d9a69a06c3c69280c3888', 34702),
            '08b-mobile-systems.png': ('b53ace305552fb63055a214838e9696517352eb212b375da6820b9959c3b4777', 35344),
            '09-mobile-320x568.png': ('9bd92e3e8cccc419a217823bb7c0c278fb0d01a36514a0cde487c63878cb42f9', 32448),
            '10-mobile-844x390.png': ('68ba5cad655b6f68f71a8751ecd9ae16f3f34994cae65859494867cdcc2b726d', 34142),
          }
          for name, (sha, size) in expected.items():
            data = pathlib.Path(name).read_bytes()
            got = hashlib.sha256(data).hexdigest()
            if len(data) != size or got != sha or data[:4] != b'RIFF':
              print(name, 'FAIL', len(data), got, data[:16])
              sys.exit(1)
            print(name, 'OK', size)
          PY
          cd "${GITHUB_WORKSPACE}"
          rm -f .github/workflows/import-r185-screenshots.yml
          git config user.name "wiiiimm"
          git config user.email "email@wiiiimm.codes"
          git add docs/verification/three-r185
          git add -u .github/workflows/import-r185-screenshots.yml
          git commit -m "docs(SWR-526): add r185 explorer verification screenshots"
          git push origin HEAD:feature/swr-526-three-r185
